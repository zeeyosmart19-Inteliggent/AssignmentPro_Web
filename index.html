.faint { color: var(--text-3); }
.small { font-size: 13px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-2); }
.meta-row span { display: inline-flex; align-items: center; gap: 6px; }
.meta-row svg { width: 15px; height: 15px; opacity: .8; }
.divider { height: 1px; background: var(--line); margin: 6px 0; border: 0; }

.list { display: grid; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 14px 6px; border-top: 1px solid var(--line); color: var(--text); min-width: 0; }
.list-item:first-child { border-top: 0; }
a.list-item:hover { color: var(--text); background: rgb(var(--ink) / .03); border-radius: 14px; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .sub { font-size: 13px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Status chips */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 650; white-space: nowrap; color: var(--c, #cbd2f5); background: color-mix(in srgb, var(--c, #cbd2f5) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, #cbd2f5) 30%, transparent); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.chip.plain::before { display: none; }
.st-not_started { --c: #aab4d8; }
.st-in_progress { --c: var(--amber); }
.st-submitted { --c: var(--cyan); }
.st-graded { --c: var(--green); }
.st-late { --c: var(--rose); }
.st-draft { --c: #c4b5fd; }
.st-published { --c: var(--green); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; color: #fff; background: linear-gradient(135deg, #fb7185, #f472b6); box-shadow: inset 0 1px 0 rgb(var(--ink) / .35); }

.score { display: inline-flex; align-items: baseline; gap: 2px; font-weight: 750; font-size: 20px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score small { font-size: 12px; color: var(--text-3); font-weight: 600; }
.ring { --p: 0; --size: 64px; width: var(--size); height: var(--size); border-radius: 50%; display: grid; place-items: center; flex: none;
  background: conic-gradient(var(--ring-c, #7dd3fc) calc(var(--p) * 1%), rgb(var(--ink) / .08) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: #0d1330; box-shadow: inset 0 1px 0 rgb(var(--ink) / .1); }
.ring span { position: relative; font-weight: 750; font-size: 16px; font-variant-numeric: tabular-nums; }

.progress { height: 8px; border-radius: 99px; background: rgb(var(--ink) / .08); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0, 0, 0, .3); }
.progress > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); box-shadow: 0 0 12px rgba(120, 160, 255, .6); transition: width .6s var(--ease); }

.empty { text-align: center; padding: 46px 24px; display: grid; justify-items: center; gap: 12px; }
.empty .art { width: 74px; height: 74px; border-radius: 24px; display: grid; place-items: center; background: linear-gradient(160deg, rgba(139, 123, 255, .3), rgba(34, 211, 238, .14)); box-shadow: inset 0 1px 0 rgb(var(--ink) / .3), inset 0 0 0 1px rgb(var(--ink) / .1); color: #d4d8ff; }
.empty .art svg { width: 32px; height: 32px; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--text-2); max-width: 420px; }

/* Table */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 12px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 0 12px 12px; white-space: nowrap; }
.table td { padding: 13px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
.table tr.clickable { cursor: pointer; transition: background .15s; }
.table tr.clickable:hover td { background: rgb(var(--ink) / .035); }
.person { display: flex; align-items: center; gap: 11px; min-width: 0; }
.person .n { font-weight: 600; }
.person .e { font-size: 12.5px; color: var(--text-3); }

/* Invite code */
.code { font-family: var(--mono); font-weight: 700; letter-spacing: .18em; font-size: 15px; padding: 6px 12px; border-radius: 10px; background: rgba(6, 10, 30, .5); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .12); }
.code-xl { font-family: var(--mono); font-size: clamp(30px, 5vw, 44px); font-weight: 800; letter-spacing: .24em; background: linear-gradient(90deg, #d7d2ff, #8ae9fb); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ---------- Auth / landing ---------- */
.auth { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: 1.1fr minmax(380px, 480px); gap: 40px; align-items: center; padding: 40px clamp(20px, 5vw, 72px); max-width: 1320px; margin: 0 auto; }
.hero { display: grid; gap: 28px; align-content: center; }
.hero h1 { font-size: clamp(36px, 5.2vw, 64px); font-weight: 760; letter-spacing: -.045em; line-height: 1.02; }
.hero h1 em { font-style: normal; background: linear-gradient(95deg, #c9c2ff 10%, #7fdff7 60%, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .lead { font-size: 18px; color: var(--text-2); max-width: 540px; line-height: 1.6; }
.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 600px; }
.feature { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 18px; }
.feature .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--ic); box-shadow: inset 0 1px 0 rgb(var(--ink) / .3); color: #fff; }
.feature .ic svg { width: 17px; height: 17px; }
.feature b { display: block; font-size: 14px; }
.feature span { font-size: 12.5px; color: var(--text-2); }
.auth-card { padding: 30px; border-radius: var(--r-xl); }
.auth-card h2 { font-size: 24px; letter-spacing: -.03em; }
.auth-card .sub { color: var(--text-2); margin: 6px 0 22px; }
.auth-switch { text-align: center; font-size: 14px; color: var(--text-2); margin-top: 18px; }
.auth-foot { margin-top: 18px; text-align: center; }
.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 50px; }
.pw-wrap .icon-btn { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; background: transparent; box-shadow: none; }
.pw-wrap .icon-btn:active { transform: translateY(-50%) scale(.92); }

/* ---------- Focus layout (workspace / editor / review) ---------- */
.focus { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr; }
.focus-bar { position: sticky; top: 0; z-index: 30; padding: 12px 16px 0; }
.focus-bar-inner { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 22px; }
.focus-bar .title-block { min-width: 0; flex: 1; }
.focus-bar .t { font-weight: 680; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -.02em; }
.focus-bar .s { font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exit-x { width: 42px; height: 42px; }
.save-state { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 0 12px; height: 32px; border-radius: 999px; background: rgb(var(--ink) / .05); white-space: nowrap; }
.save-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
.save-state.saving i { background: var(--amber); box-shadow: 0 0 10px var(--amber); animation: pulse 1s infinite; }
.save-state.error i { background: var(--rose); box-shadow: 0 0 10px var(--rose); }
.focus-body { padding: 18px 16px 40px; width: 100%; max-width: 1320px; margin: 0 auto; }

.ws { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start; }
.ws-side { position: sticky; top: 92px; display: grid; gap: 14px; }
.qnav { padding: 12px; border-radius: var(--r-lg); display: grid; gap: 4px; }
.qnav-h { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); padding: 6px 10px 8px; }
.qnav button { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 10px; border: 0; border-radius: 14px; background: transparent; color: var(--text-2); transition: background .2s, color .2s; }
.qnav button:hover { background: rgb(var(--ink) / .06); color: var(--text); }
.qnav button[aria-current="true"] { background: linear-gradient(160deg, rgb(var(--ink) / .15), rgb(var(--ink) / .05)); color: var(--strong); box-shadow: inset 0 1px 0 rgb(var(--ink) / .25); }
.qnav .num { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 700; flex: none; background: rgb(var(--ink) / .07); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .1); }
.qnav .done .num { background: linear-gradient(135deg, rgba(52, 211, 153, .55), rgba(34, 211, 238, .4)); color: #fff; }
.qnav .qt { font-size: 13.5px; font-weight: 560; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.qnav .marks { display: flex; gap: 4px; color: var(--text-3); }
.qnav .marks svg { width: 14px; height: 14px; }
.ws-info { padding: 16px; border-radius: var(--r-lg); display: grid; gap: 10px; font-size: 13.5px; }
.ws-main { display: grid; gap: 18px; min-width: 0; }
.q-card { padding: 26px; border-radius: var(--r-xl); display: grid; gap: 20px; animation: viewIn .45s var(--ease) both; }
.q-head { display: flex; gap: 14px; align-items: flex-start; }
.q-index { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 12.5px; font-weight: 700; letter-spacing: .04em; color: #dcd8ff; background: rgba(139, 123, 255, .22); box-shadow: inset 0 0 0 1px rgba(139, 123, 255, .4); }
.q-prompt { font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.q-foot { display: flex; align-items: center; gap: 10px; }
.instructions { color: var(--text-2); line-height: 1.65; word-break: break-word; }
.instructions :first-child { margin-top: 0; }
.instructions :last-child { margin-bottom: 0; }

/* Rich text editor */
.rte { border-radius: 20px; background: var(--field); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .1), inset 0 2px 10px rgba(0, 0, 0, .25); transition: box-shadow .2s; }
.rte:focus-within { box-shadow: inset 0 0 0 1px rgba(139, 160, 255, .65), 0 0 0 4px rgba(120, 130, 255, .12); }
.rte-bar { display: flex; flex-wrap: wrap; gap: 2px; padding: 7px; border-bottom: 1px solid var(--line); }
.rte-bar button { width: 34px; height: 34px; border: 0; border-radius: 10px; background: transparent; color: var(--text-2); display: grid; place-items: center; transition: background .15s, color .15s; }
.rte-bar button:hover { background: rgb(var(--ink) / .08); color: var(--text); }
.rte-bar button[aria-pressed="true"] { background: rgba(139, 123, 255, .28); color: var(--strong); }
.rte-bar button svg { width: 17px; height: 17px; }
.rte-bar .sep { width: 1px; margin: 6px 4px; background: var(--line); }
.rte-area { min-height: 200px; max-height: 60vh; overflow-y: auto; padding: 16px 18px; outline: 0; line-height: 1.7; font-size: 15.5px; word-break: break-word; }
.rte-area.compact { min-height: 120px; }
.rte-area:empty::before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
.rte-foot { display: flex; justify-content: space-between; padding: 0 14px 10px; font-size: 12px; color: var(--text-3); }
.prose h2, .prose h3, .rte-area h2, .rte-area h3 { font-size: 1.2em; margin: .8em 0 .4em; }
.prose blockquote, .rte-area blockquote { margin: .6em 0; padding: .4em 1em; border-left: 3px solid rgba(139, 123, 255, .7); background: rgba(139, 123, 255, .08); border-radius: 0 10px 10px 0; color: var(--text-2); }
.prose ul, .prose ol, .rte-area ul, .rte-area ol { padding-left: 1.4em; }
.prose p, .rte-area p { margin: .4em 0; }
.prose code, .rte-area code, .prose pre, .rte-area pre { font-family: var(--mono); font-size: .9em; background: var(--sunk); padding: .1em .35em; border-radius: 6px; }
.prose pre, .rte-area pre { padding: .8em 1em; overflow-x: auto; }
.answer-box { padding: 16px 18px; border-radius: 16px; background: rgba(6, 10, 30, .35); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .08); line-height: 1.7; }
.answer-box.empty-answer { color: var(--text-3); font-style: italic; }

/* Recorder */
.rec { border-radius: 22px; padding: 16px; display: grid; gap: 14px; background: linear-gradient(160deg, rgba(139, 123, 255, .1), rgba(34, 211, 238, .05)); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .1), inset 0 1px 0 rgb(var(--ink) / .14); }
.rec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rec-head .label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.rec-head .label svg { width: 17px; height: 17px; color: #b8c0ff; }
.rec-live { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 18px; background: rgba(6, 10, 30, .5); box-shadow: inset 0 0 0 1px rgba(251, 113, 133, .35); }
.rec-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--rose); box-shadow: 0 0 0 0 rgba(251, 113, 133, .7); animation: recPulse 1.4s infinite; flex: none; }
.rec-live.paused .rec-dot { animation: none; background: var(--amber); }
@keyframes recPulse { 70% { box-shadow: 0 0 0 10px rgba(251, 113, 133, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 113, 133, 0); } }
.rec-time { font-family: var(--mono); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 54px; }
.rec-live canvas { flex: 1; min-width: 60px; height: 36px; }
.rec-btn { width: 44px; height: 44px; }
.rec-start { background: linear-gradient(135deg, #fb7185, #e1366b) !important; color: #fff !important; box-shadow: inset 0 1px 0 rgb(var(--ink) / .4), 0 8px 20px -8px rgba(251, 113, 133, .9) !important; }
.rec-list { display: grid; gap: 10px; }
.rec-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; background: var(--field); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .08); }
.rec-item.uploading { opacity: .8; }
.rec-item .rec-meta { display: grid; gap: 4px; min-width: 0; }
.rec-name { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; min-width: 0; }
.rec-name input { background: transparent; border: 0; outline: 0; padding: 2px 6px; margin-left: -6px; border-radius: 8px; font-weight: 600; min-width: 0; width: 100%; color: var(--text); }
.rec-name input:focus { background: rgb(var(--ink) / .08); }
.rec-actions { display: flex; gap: 6px; }
.play-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #fff; background: var(--accent); box-shadow: inset 0 1px 0 rgb(var(--ink) / .45), 0 6px 16px -6px rgba(110, 130, 255, .9); transition: transform .25s var(--spring); flex: none; }
.play-btn:active { transform: scale(.9); }
.play-btn svg { width: 18px; height: 18px; }
.wave { position: relative; height: 30px; cursor: pointer; touch-action: none; }
.wave canvas { width: 100%; height: 100%; display: block; }
.wave-time { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-3); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.rec-note { font-size: 12.5px; color: var(--text-3); }
.up-bar { height: 4px; border-radius: 99px; background: rgb(var(--ink) / .1); overflow: hidden; }
.up-bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }

.ws-pager { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.banner { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--r-lg); }
.banner .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex: none; background: var(--ic, rgba(52, 211, 153, .25)); color: #fff; box-shadow: inset 0 1px 0 rgb(var(--ink) / .3); }
.banner .ic svg { width: 20px; height: 20px; }
.feedback-box { padding: 16px 18px; border-radius: 18px; background: linear-gradient(160deg, rgba(52, 211, 153, .12), rgba(34, 211, 238, .06)); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .25); white-space: pre-wrap; line-height: 1.6; }

/* Grade panel */
.grade-panel { position: sticky; top: 92px; padding: 22px; border-radius: var(--r-xl); display: grid; gap: 16px; }
.score-input { display: flex; align-items: baseline; gap: 8px; justify-content: center; padding: 10px 0 2px; }
.score-input input { width: 130px; text-align: center; font-size: 54px; font-weight: 780; letter-spacing: -.05em; background: transparent; border: 0; outline: 0; color: var(--text); font-variant-numeric: tabular-nums; border-radius: 16px; -moz-appearance: textfield; }
.score-input input::-webkit-outer-spin-button, .score-input input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.score-input input:focus { background: rgb(var(--ink) / .05); }
.score-input span { font-size: 22px; color: var(--text-3); font-weight: 650; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 99px; outline: 0; background: linear-gradient(90deg, #8b7bff 0, #22d3ee var(--v, 0%), rgb(var(--ink) / .1) var(--v, 0%)); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0, 0, 0, .4), inset 0 -2px 4px rgba(0, 0, 0, .15); cursor: grab; }
.range::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 4px 12px rgba(0, 0, 0, .4); cursor: grab; }
.quick-scores { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.review-q { padding: 22px; border-radius: var(--r-lg); display: grid; gap: 14px; }

/* Question builder */
.qb-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 14px; border-radius: 20px; background: rgba(6, 10, 30, .3); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .08); animation: viewIn .35s var(--ease) both; }
.qb-item .q-index { margin-top: 8px; }
.qb-tools { display: flex; flex-direction: column; gap: 4px; }
.attach-list { display: grid; gap: 8px; }
.attach { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: rgba(6, 10, 30, .35); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .08); color: var(--text); min-width: 0; }
a.attach:hover { color: var(--text); background: rgba(6, 10, 30, .5); }
.attach .fi { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; background: rgba(139, 123, 255, .2); color: #cfd0ff; flex: none; }
.attach .fi svg { width: 18px; height: 18px; }
.attach .grow { flex: 1; min-width: 0; }
.attach .fn { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attach .fs { font-size: 12px; color: var(--text-3); }
.dropzone { display: grid; place-items: center; gap: 6px; text-align: center; padding: 20px; border-radius: 18px; border: 1.5px dashed rgb(var(--ink) / .18); color: var(--text-2); font-size: 14px; cursor: pointer; transition: background .2s, border-color .2s; }
.dropzone:hover, .dropzone.drag { background: rgba(139, 123, 255, .08); border-color: rgba(139, 123, 255, .55); }
.dropzone svg { width: 24px; height: 24px; color: #b8c0ff; }
.student-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; max-height: 280px; overflow-y: auto; padding: 2px; }
.pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(6, 10, 30, .3); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .08); cursor: pointer; font-size: 14px; }
.pick:has(input:checked) { background: rgba(139, 123, 255, .16); box-shadow: inset 0 0 0 1px rgba(139, 123, 255, .5); }
.editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.editor-side { position: sticky; top: 92px; display: grid; gap: 18px; }
.max-score { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 14px; background: rgba(6, 10, 30, .35); box-shadow: inset 0 0 0 1px rgb(var(--ink) / .08); }

/* ---------- Modal ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(4, 6, 18, .52); -webkit-backdrop-filter: blur(8px) saturate(120%); backdrop-filter: blur(8px) saturate(120%); animation: fadeIn .28s var(--ease) both; }
.modal-backdrop.closing { animation: fadeOut .22s var(--ease) both; }
.modal { width: min(440px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; padding: 28px; border-radius: 30px; text-align: center; display: grid; gap: 10px;
  background: linear-gradient(160deg, rgb(var(--ink) / .16), rgb(var(--ink) / .06) 45%, rgb(var(--ink) / .04));
  -webkit-backdrop-filter: blur(36px) saturate(180%); backdrop-filter: blur(36px) saturate(180%);
  animation: modalIn .5s var(--spring) both; }
.modal.wide { width: min(560px, 100%); text-align: left; }

route('POST', '/api/auth/register', async ({ body: b }) => {
  rateLimit('reg', 20, 15 * 60000);
  const role = b.role === 'teacher' ? 'teacher' : b.role === 'student' ? 'student' : fail(400, 'Choose Student or Teacher.');
  const name = str(b.name, { min: 2, max: 80, field: 'Name' });
  const email = str(b.email, { min: 3, max: 160, field: 'Email' }).toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) fail(400, 'Enter a valid email address.');
  const pw = typeof b.password === 'string' ? b.password : '';
  if (pw.length < 8) fail(400, 'Password must be at least 8 characters.');
  if (pw.length > 200) fail(400, 'Password is too long.');
  if (db.users.some((u) => u.email === email)) fail(409, 'An account with this email already exists.');
  const u = { id: nextId('users'), role, roles: [role], name, email, passHash: await hashPassword(pw), createdAt: now() };
  db.users.push(u);
  await createSession(u.id, !!b.remember);
  let joined = null;
  if (role === 'student' && typeof b.inviteCode === 'string' && b.inviteCode.trim()) {
    const c = classByCode(b.inviteCode);
    if (c) { db.enrollments.push({ classId: c.id, studentId: u.id, joinedAt: now() }); joined = c.name; notifyJoined(u, c); }
  }
  return { user: publicUser(u), joined };
}, { auth: false });

route('POST', '/api/auth/login', async ({ body: b }) => {
  const email = str(b.email, { min: 1, max: 160, field: 'Email' }).toLowerCase();
  rateLimit('login:' + email, 10, 15 * 60000);
  const pw = typeof b.password === 'string' ? b.password.slice(0, 200) : '';
  const u = db.users.find((x) => x.email === email);
  if (!u) fail(401, db.users.length
    ? 'No account with this email was found in this browser. Check the spelling, or create an account.'
    : 'No accounts exist in this browser yet. Accounts are saved only in the browser where they were created — create an account first.');
  if (!(await verifyPassword(pw, u.passHash))) fail(401, 'Incorrect password. Please try again.');
  // The Student/Teacher tab decides which side of the account you open; an account can have both.
  const roleAdded = activateRole(u, b.role);
  await createSession(u.id, !!b.remember);
  return { user: publicUser(u), roleAdded };
}, { auth: false });

route('POST', '/api/auth/oauth', async ({ body: b }) => {

function validateAssignment(user, b) {
  const title = str(b.title, { min: 1, max: 160, field: 'Title' });
  const classId = intId(b.classId); teacherClass(user, classId);
  const instructions = sanitizeHtml(b.instructions, 100000);
  let dueAt = null;
  if (b.dueAt !== null && b.dueAt !== undefined && b.dueAt !== '') { dueAt = Number(b.dueAt); if (!Number.isFinite(dueAt) || dueAt < 0) fail(400, 'Invalid deadline.'); }
  const assignAll = b.assignAll !== false;
  const ids = Array.isArray(b.studentIds) ? [...new Set(b.studentIds.map(Number).filter(Number.isInteger))] : [];
  const targets = ids.filter((id) => enrolled(classId, id));
  if (!assignAll && !targets.length && b.publish) fail(400, 'Select at least one student, or assign to the entire class.');
  const qs = (Array.isArray(b.questions) ? b.questions : []).slice(0, 101);
  if (qs.length > 100) fail(400, 'Too many questions.');
  const cleanQs = qs.map((x) => ({ id: x && Number.isInteger(x.id) ? x.id : null, prompt: str(x && x.prompt, { max: 5000, field: 'Question' }) })).filter((x) => x.prompt);
  if (b.publish && !cleanQs.length) fail(400, 'Add at least one question before publishing.');
  return { title, classId, instructions, dueAt, assignAll, targets, cleanQs };
}
function saveQuestions(aid, cleanQs, after) {
  const existing = new Set(db.questions.filter((q) => q.assignmentId === aid).map((q) => q.id));
  const keep = new Set();
  cleanQs.forEach((x, i) => {
    if (x.id && existing.has(x.id)) { const q = byId('questions', x.id); q.prompt = x.prompt; q.position = i; keep.add(x.id); }
    else db.questions.push({ id: nextId('questions'), assignmentId: aid, position: i, prompt: x.prompt });
  });
  const gone = new Set([...existing].filter((id) => !keep.has(id)));
  if (gone.size) {
    const files = db.recordings.filter((r) => gone.has(r.questionId)).map((r) => r.fileKey);
    db.recordings = db.recordings.filter((r) => !gone.has(r.questionId));
    db.answers = db.answers.filter((x) => !gone.has(x.questionId));
    db.questions = db.questions.filter((q) => !gone.has(q.id));
    after.push(() => removeFiles(files));
  }
}
function saveTargets(aid, assignAll, targets) {
  db.assignmentStudents = db.assignmentStudents.filter((x) => x.assignmentId !== aid);
  if (!assignAll) targets.forEach((sid) => db.assignmentStudents.push({ assignmentId: aid, studentId: sid }));
}

route('PUT', '/api/assignments/:id', async ({ user, params, body: b, after }) => {

route('POST', '/api/assignments/:id/attachments', async ({ user, params, blob, headers }) => {

  if (blob.size > MAX_ATTACHMENT) fail(413, 'File is too large.');
  let filename = ''; try { filename = decodeURIComponent(headers['X-Filename'] || ''); } catch { /* ignore */ }
  filename = filename.replace(/[\\/\r\n"]/g, '_').trim().slice(0, 180) || 'attachment';
  const mime = String(headers['Content-Type'] || blob.type || 'application/octet-stream').split(';')[0].trim().slice(0, 100) || 'application/octet-stream';
  const fileKey = 'f' + randHex(16);
  try { await idbPut('files', fileKey, blob); } catch { fail(507, 'Your browser storage is full. Free some space and try again.'); }
  const f = { id: nextId('attachments'), assignmentId: a.id, filename, mime, size: blob.size, fileKey, createdAt: now() };
  db.attachments.push(f);

  for (const x of b.answers) {
    const qid = Number(x && x.questionId); if (!qids.has(qid)) continue;
    const html = sanitizeHtml(x.html, 300000);
    const ex = db.answers.find((y) => y.submissionId === sub.id && y.questionId === qid);
    if (ex) { ex.html = html; ex.updatedAt = t; } else db.answers.push({ submissionId: sub.id, questionId: qid, html, updatedAt: t });
  }
  sub.updatedAt = t;
  return { savedAt: t };
}, { role: 'student' });
route('POST', '/api/submissions/:id/recordings', async ({ user, params, blob, headers }) => {
  const { sub, assignment } = editable(user, params);
  if (db.recordings.filter((r) => r.submissionId === sub.id).length >= 30) fail(400, 'You can attach at most 30 recordings to one assignment.');
  const qid = Number(headers['X-Question-Id']);
  if (!db.questions.some((q) => q.id === qid && q.assignmentId === assignment.id)) fail(400, 'Unknown question.');
  let mime = String(headers['Content-Type'] || blob?.type || '').split(';')[0].trim().toLowerCase();
  if (mime === 'video/webm') mime = 'audio/webm';
  if (!/^audio\/(webm|ogg|mp4|mpeg|aac|wav|x-m4a|m4a)$/.test(mime)) fail(415, 'Unsupported audio format.');
  if (!blob || !blob.size) fail(400, 'Empty recording.');
  if (blob.size > MAX_AUDIO) fail(413, 'Recording is too large.');
  let label = ''; try { label = decodeURIComponent(headers['X-Label'] || ''); } catch { /* ignore */ }
  const fileKey = 'r' + randHex(16);
  try { await idbPut('files', fileKey, new Blob([blob], { type: mime })); } catch { fail(507, 'Your browser storage is full. Free some space and try again.'); }
  const t = now();
  const r = { id: nextId('recordings'), submissionId: sub.id, questionId: qid, label: label.replace(/[\r\n]/g, ' ').trim().slice(0, 80), mime, size: blob.size, duration: Math.max(0, Math.min(3600, Number(headers['X-Duration']) || 0)), fileKey, createdAt: t };
  db.recordings.push(r); sub.updatedAt = t;

  if (recovered) { toast(`Recovered ${recovered} unsaved answer${recovered === 1 ? '' : 's'} from this device`); scheduleSave(); }
  return cleanup;
}

        const name = $('#c-name', m).value.trim(); const subject = $('#c-sub', m).value.trim();
        if (!name) { toast('Please enter a class name.', 'err'); $('#c-name', m).focus(); return false; }
        if (existing) { await api('PATCH', `/api/classes/${existing.id}`, { name, subject }); result = existing; }
        else result = (await api('POST', '/api/classes', { name, subject })).class;
        return true;
      } },
    ],
    onOpen: (m) => $$('input', m).forEach((i) => i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); m.querySelector('[data-i="1"]').click(); } })),
  });
  return result;
}

  } catch (e) { if (alive()) $('#app').innerHTML = `<div class="focus"><div class="focus-body">${errorView(e.message, '#/t/assignments')}</div></div>`; return; }
  if (!alive()) return;

    $('[data-exit]').addEventListener('click', () => navigate('#/t', { force: true }));
    return;
  }
  const preClass = Number(query().get('class')) || classes[0].id;
  const preStudent = Number(query().get('student')) || 0;
  const m = {
    id: a?.id || null,
    title: a?.title || '',
    classId: a?.classId || (classes.some((c) => c.id === preClass) ? preClass : classes[0].id),
    instructions: a?.instructions || '',
    dueAt: a?.dueAt || null,
    assignAll: a ? a.assignAll : !preStudent,
    studentIds: new Set(a?.studentIds || (!a && preStudent ? [preStudent] : [])),
    questions: a ? a.questions.map((q) => ({ id: q.id, prompt: q.prompt })) : [{ id: null, prompt: '' }],
    attachments: a?.attachments || [],
    status: a?.status || 'draft',
  };
  let dirty = false;
  let roster = [];
  const markDirty = () => { dirty = true; };

  $('#app').innerHTML = `<div class="focus">
    ${focusBar({
      title: isNew ? 'Assign a task' : `Edit: ${a.title}`, sub: isNew ? 'Draft' : (m.status === 'published' ? 'Published — changes are visible to students when saved' : 'Draft'),
      right: `<button type="button" class="btn hide-m" data-save="draft">${m.status === 'published' ? 'Save as draft' : 'Save draft'}</button>
        <button type="button" class="btn btn-primary" data-save="publish">${icon('send')}<span>${m.status === 'published' ? 'Save & publish' : 'Publish'}</span></button>`,
    })}
    <div class="focus-body"><div class="editor-layout">
      <div class="stack">
        <section class="glass panel form-grid">
          <div class="field"><label for="e-title">Title</label><input class="input" id="e-title" maxlength="160" placeholder="e.g. Persuasive speech: school uniforms" value="${esc(m.title)}" style="font-size:17px;font-weight:600"></div>
          <div class="field"><span class="label">Instructions</span><div id="e-instr"></div></div>
        </section>
        <section class="glass panel form-grid">
          <div class="section-title" style="margin:0"><h2>Questions</h2><span class="muted small" id="q-count"></span></div>
          <p class="hint" style="margin-top:-8px">Students can answer each question in writing, with audio recordings, or both.</p>
          <div class="form-grid" id="q-list"></div>
          <div><button type="button" class="btn" data-act="add-q">${icon('plus')}Add question</button></div>
        </section>
        <section class="glass panel form-grid">
          <div class="section-title" style="margin:0"><h2>Attachments</h2></div>
          <div class="attach-list" id="att-list"></div>
          <label class="dropzone" id="drop">${icon('upload')}<b>Upload files</b><span class="faint small">Worksheets, PDFs, images or audio · up to 25 MB each</span><input type="file" multiple hidden id="file-in"></label>
        </section>
      </div>
      <aside class="editor-side">
        <section class="glass panel form-grid">
          <div class="field"><label for="e-class">Class</label><select class="select" id="e-class">${classes.map((c) => `<option value="${c.id}" ${c.id === m.classId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
          <div class="field"><label for="e-due">Deadline</label><input class="input" type="datetime-local" id="e-due" value="${toLocalInput(m.dueAt)}"><span class="hint">Leave empty for no deadline.</span></div>
          <div class="max-score"><span class="label" style="margin:0">Maximum score</span><span class="score">100</span></div>
        </section>
        <section class="glass panel form-grid">
          <span class="label">Assign to</span>
          <div class="segmented" id="assign-seg"><span class="thumb"></span><button type="button" data-all="1">Entire class</button><button type="button" data-all="0">Selected students</button></div>
          <div id="picks"></div>
        </section>
      </aside>
    </div></div></div>`;
  const root = $('#app');
  const instr = createEditor($('#e-instr', root), { html: m.instructions, placeholder: 'Explain what students should do…', compact: true, label: 'Instructions', onChange: (h) => { m.instructions = h; markDirty(); } });

  const drawQs = () => {
    $('#q-list', root).innerHTML = m.questions.map((q, i) => `<div class="qb-item" data-qi="${i}">
      <span class="q-index">Q${i + 1}</span>
      <textarea class="textarea" rows="2" maxlength="5000" placeholder="Write the question or prompt…" aria-label="Question ${i + 1}">${esc(q.prompt)}</textarea>
      <div class="qb-tools">
        <button type="button" class="icon-btn sm" data-qmove="-1" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>${icon('up')}</button>
        <button type="button" class="icon-btn sm" data-qmove="1" aria-label="Move down" ${i === m.questions.length - 1 ? 'disabled' : ''}>${icon('down')}</button>
        <button type="button" class="icon-btn sm danger" data-qdel aria-label="Remove question">${icon('trash')}</button>
      </div></div>`).join('') || '<p class="faint">No questions yet.</p>';
    $('#q-count', root).textContent = `${m.questions.length} question${m.questions.length === 1 ? '' : 's'}`;
  };
  const drawAtt = () => {
    $('#att-list', root).innerHTML = m.attachments.map((f) => `<div class="attach"><span class="fi">${icon('paperclip')}</span><span class="grow"><div class="fn">${esc(f.filename)}</div><div class="fs">${fmtSize(f.size)}</div></span>
      <a class="icon-btn sm" href="#" data-file="${f.id}" aria-label="Open file">${icon('eye')}</a>
      <button type="button" class="icon-btn sm danger" data-attdel="${f.id}" aria-label="Remove file">${icon('trash')}</button></div>`).join('');
  };
  const seg = $('#assign-seg', root);
  const drawAssign = async (reload) => {
    $$('[data-all]', seg).forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.all === '1') === m.assignAll)));
    requestAnimationFrame(() => { const b = $(`[data-all="${m.assignAll ? 1 : 0}"]`, seg); const th = $('.thumb', seg); th.style.width = b.offsetWidth + 'px'; th.style.transform = `translateX(${b.offsetLeft - 4}px)`; });
    const picks = $('#picks', root);
    if (reload) {
      try { roster = (await api('GET', `/api/classes/${m.classId}`)).students; } catch { roster = []; }
      const valid = new Set(roster.map((s) => s.id));
      m.studentIds = new Set([...m.studentIds].filter((x) => valid.has(x)));
    }
    if (m.assignAll) { picks.innerHTML = `<p class="hint">Every student in the class — including students who join later — will get this assignment. (${roster.length} enrolled now)</p>`; return; }
    picks.innerHTML = roster.length ? `<div class="row small" style="justify-content:space-between;margin-bottom:8px"><span class="muted"><b id="pick-n">${m.studentIds.size}</b> selected</span><button type="button" class="btn btn-sm btn-ghost" data-act="pick-all">Select all</button></div>
      <div class="student-picks">${roster.map((s) => `<label class="pick"><input type="checkbox" class="sr-only" value="${s.id}" ${m.studentIds.has(s.id) ? 'checked' : ''}>${avatar(s.name, 'sm')}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.name)}</span></label>`).join('')}</div>`
      : '<p class="hint">No students have joined this class yet. Share the class code first.</p>';
  };
  drawQs(); drawAtt(); drawAssign(true);

  root.addEventListener('input', (e) => {
    if (e.target.id === 'e-title') { m.title = e.target.value; markDirty(); }
    const qi = e.target.closest('[data-qi]');
    if (qi && e.target.tagName === 'TEXTAREA') { m.questions[Number(qi.dataset.qi)].prompt = e.target.value; markDirty(); }
  });
  root.addEventListener('change', (e) => {
    if (e.target.id === 'e-class') { m.classId = Number(e.target.value); markDirty(); drawAssign(true); }
    if (e.target.id === 'e-due') { m.dueAt = e.target.value ? new Date(e.target.value).getTime() : null; markDirty(); }
    if (e.target.closest('.pick')) { const sid = Number(e.target.value); e.target.checked ? m.studentIds.add(sid) : m.studentIds.delete(sid); $('#pick-n', root).textContent = m.studentIds.size; markDirty(); }
    if (e.target.id === 'file-in') { uploadFiles([...e.target.files]); e.target.value = ''; }
  });
  root.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.closest('[data-exit]')) return onExit();
    const sv = t.closest('[data-save]'); if (sv) return save(sv.dataset.save === 'publish');
    if (t.closest('[data-act="add-q"]')) { m.questions.push({ id: null, prompt: '' }); markDirty(); drawQs(); $$('#q-list textarea', root).pop()?.focus(); return; }
    if (t.closest('[data-act="pick-all"]')) { roster.forEach((s) => m.studentIds.add(s.id)); markDirty(); drawAssign(false); return; }
    const all = t.closest('[data-all]'); if (all) { m.assignAll = all.dataset.all === '1'; markDirty(); drawAssign(false); return; }
    const qi = t.closest('[data-qi]');
    if (qi && t.closest('[data-qmove]')) {
      const i = Number(qi.dataset.qi), j = i + Number(t.closest('[data-qmove]').dataset.qmove);
      [m.questions[i], m.questions[j]] = [m.questions[j], m.questions[i]]; markDirty(); drawQs(); return;
    }
    if (qi && t.closest('[data-qdel]')) {
      const i = Number(qi.dataset.qi);
      const q = m.questions[i];
      if (q.id && !(await confirmDialog({ title: 'Remove this question?', body: 'Any student answers and recordings for this question will be deleted when you save.', confirm: 'Remove', danger: true }))) return;
      m.questions.splice(i, 1); markDirty(); drawQs(); return;
    }
    const ad = t.closest('[data-attdel]');
    if (ad) {
      if (!(await confirmDialog({ title: 'Remove this file?', body: 'Students will no longer be able to download it.', confirm: 'Remove', danger: true }))) return;
      try { await api('DELETE', `/api/attachments/${ad.dataset.attdel}`); m.attachments = m.attachments.filter((f) => f.id !== Number(ad.dataset.attdel)); drawAtt(); toast('File removed'); } catch (err) { toast(err.message, 'err'); }
    }
  });
  const drop = $('#drop', root);
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove('drag')));
  drop.addEventListener('drop', (e) => { e.preventDefault(); uploadFiles([...e.dataTransfer.files]); });

  const body = (publish) => ({
    title: m.title.trim(), classId: m.classId, instructions: instr.getHTML(), dueAt: m.dueAt, assignAll: m.assignAll,
    studentIds: [...m.studentIds], questions: m.questions.map((q) => ({ id: q.id, prompt: q.prompt.trim() })).filter((q) => q.prompt), publish,
  });
  async function persist(publish) {
    const b = body(publish);
    if (!b.title) throw new Error('Please give the assignment a title.');
    if (m.id) await api('PUT', `/api/assignments/${m.id}`, b);
    else m.id = (await api('POST', '/api/assignments', b)).id;
    m.status = publish ? 'published' : 'draft';
    dirty = false;
  }
  async function save(publish) {
    const btns = $$('[data-save]', root); btns.forEach((b) => { b.disabled = true; });
    try {
      await persist(publish);
      toast(publish ? 'Assignment published' : 'Draft saved');
      refreshBadges();
      navigate(`#/t/assignments/${m.id}`, { force: true });
    } catch (err) { toast(err.message, 'err'); if (err.message.includes('title')) $('#e-title', root).focus(); }
    finally { btns.forEach((b) => { b.disabled = false; }); }
  }
  async function uploadFiles(files) {
    if (!files.length) return;
    if (!m.id) {
      if (!m.title.trim()) { toast('Add a title first — the assignment is saved as a draft before uploading files.', 'err'); $('#e-title', root).focus(); return; }
      try { await persist(false); replaceHashSilently(`#/t/assignments/${m.id}/edit`); } catch (err) { toast(err.message, 'err'); return; }
    }
    for (const f of files) {
      if (f.size > 25 * 1024 * 1024) { toast(`${f.name} is larger than 25 MB.`, 'err'); continue; }
      const el = document.createElement('div');
      el.className = 'attach'; el.innerHTML = `<span class="spinner"></span><span class="grow"><div class="fn">${esc(f.name)}</div><div class="up-bar"><i style="width:0"></i></div></span>`;
      $('#att-list', root).append(el);
      try {
        const r = await upload(`/api/assignments/${m.id}/attachments`, f, { 'Content-Type': f.type || 'application/octet-stream', 'X-Filename': encodeURIComponent(f.name) }, (p) => { $('.up-bar i', el).style.width = `${p * 100}%`; });
        m.attachments.push(r.attachment);
      } catch (err) { toast(err.message, 'err'); }
      el.remove(); drawAtt();
    }
  }
  async function onExit() {
    if (await exitConfirm(() => dirty, { what: 'this assignment' })) navigate(m.id ? `#/t/assignments/${m.id}` : '#/t/assignments', { force: true });
  }
  setLeaveGuard(async () => (!dirty ? true : exitConfirm(() => dirty)));
  const onBU = (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', onBU);
  if (isNew) setTimeout(() => $('#e-title', root)?.focus(), 60);
  return () => window.removeEventListener('beforeunload', onBU);
}

/* ---------------- Review & grade ---------------- */
async function review({ id }) {
  freshRoot();
  const alive = viewAlive();
  $('#app').innerHTML = `<div class="focus">${focusBar({ title: 'Loading…', sub: '' })}<div class="focus-body"><div class="skeleton" style="height:480px;border-radius:32px"></div></div></div>`;
  let d;
  try { d = await api('GET', `/api/submissions/${encodeURIComponent(id)}`); } catch (e) { if (alive()) $('#app').innerHTML = `<div class="focus"><div class="focus-body">${errorView(e.message, '#/t')}</div></div>`; return; }
  if (!alive()) return;
  const { submission: s, student, assignment: a, siblings } = d;
  if (s.status === 'in_progress') {
    $('#app').innerHTML = `<div class="focus">${focusBar({ title: student.name, sub: esc(a.title) })}<div class="focus-body"><div class="glass panel empty"><div class="art">${icon('clock')}</div><h3>Not submitted yet</h3><p>${esc(student.name)} is still working on this assignment.</p><a class="btn" href="#/t/assignments/${a.id}">Back to assignment</a></div></div></div>`;
    $('[data-exit]').addEventListener('click', () => navigate(`#/t/assignments/${a.id}`, { force: true }));
    return;
  }
  const idx = siblings.findIndex((x) => x.id === s.id);
  const prev = siblings[idx - 1], next = siblings[idx + 1];
  const late = a.dueAt && s.submittedAt > a.dueAt;
  let score = s.score ?? '';
  let feedback = s.feedback || '';
  const initial = { score: String(score), feedback };
  const isDirty = () => String(score) !== initial.score || feedback !== initial.feedback;

  $('#app').innerHTML = `<div class="focus">
    ${focusBar({
      title: student.name, sub: `${esc(a.title)} · ${esc(a.className)}`,
      right: `<div class="row hide-m" style="gap:6px"><span class="faint small">${idx + 1} of ${siblings.length}</span>
        <button type="button" class="icon-btn sm" data-nav="${prev ? prev.id : ''}" ${prev ? '' : 'disabled'} aria-label="Previous submission">${icon('chevronL')}</button>
        <button type="button" class="icon-btn sm" data-nav="${next ? next.id : ''}" ${next ? '' : 'disabled'} aria-label="Next submission">${icon('chevronR')}</button></div>`,
    })}
    <div class="focus-body"><div class="editor-layout">
      <main class="stack">
        <section class="glass panel row-wrap" style="gap:14px">${avatar(student.name, 'lg')}<div class="grow" style="flex:1;min-width:200px"><h2 style="font-size:20px">${esc(student.name)}</h2><div class="muted small">${esc(student.email)}</div></div>
          <div class="meta-row" style="display:grid;gap:6px"><span>${icon('send')}Submitted ${fmtDateTime(s.submittedAt)} ${late ? chip('late', 'Late') : ''}</span><span>${icon('calendar')}${a.dueAt ? 'Due ' + fmtDateTime(a.dueAt) : 'No deadline'}</span><span>${icon('mic')}${s.recordings.length} recording${s.recordings.length === 1 ? '' : 's'}</span></div></section>
        ${readonlyQuestionsHTML(a, s)}
      </main>
      <aside class="grade-panel glass">
        <div class="row" style="justify-content:space-between"><h2 style="font-size:18px">Grade</h2>${chip(s.status)}</div>
        <div class="score-input"><input type="number" inputmode="numeric" min="0" max="100" step="1" id="g-score" value="${esc(score)}" placeholder="—" aria-label="Score out of 100"><span>/ 100</span></div>
        <input type="range" class="range" id="g-range" min="0" max="100" step="1" value="${score === '' ? 0 : score}" aria-label="Score slider">
        <div class="quick-scores">${[100, 90, 80, 70, 60, 50].map((n) => `<button type="button" class="btn btn-sm" data-q="${n}">${n}</button>`).join('')}</div>
        <div class="field"><label for="g-fb">Feedback for ${esc(student.name.split(' ')[0])}</label><textarea class="textarea" id="g-fb" rows="6" maxlength="10000" placeholder="What went well, and what to improve…">${esc(feedback)}</textarea></div>
        <button type="button" class="btn btn-primary btn-lg btn-block" id="g-save">${icon('check')}${s.status === 'graded' ? 'Update grade' : 'Save grade'}</button>
        ${s.gradedAt ? `<p class="hint" style="text-align:center">Last graded ${fmtDateTime(s.gradedAt)}</p>` : ''}
      </aside>
    </div></div></div>`;
  const root = $('#app');
  const players = mountReadonlyPlayers(root);
  const inp = $('#g-score', root), rng = $('#g-range', root), fb = $('#g-fb', root);
  const paintRange = () => rng.style.setProperty('--v', `${rng.value}%`);
  paintRange();
  const setScore = (v, from) => {
    if (v === '') { score = ''; return; }
    v = Math.max(0, Math.min(100, Math.round(Number(v)))); score = v;
    if (from !== 'inp') inp.value = v;
    if (from !== 'rng') rng.value = v;
    paintRange();
  };
  inp.addEventListener('input', () => setScore(inp.value === '' ? '' : inp.value, 'inp'));
  inp.addEventListener('blur', () => { if (inp.value !== '') inp.value = score; });
  rng.addEventListener('input', () => setScore(rng.value, 'rng'));
  fb.addEventListener('input', () => { feedback = fb.value; });
  const goTo = (hash) => navigate(hash, { force: true });
  async function saveGrade() {
    if (score === '' || !Number.isInteger(Number(score))) { toast('Enter a score from 0 to 100.', 'err'); inp.focus(); return false; }
    const btn = $('#g-save', root); btn.disabled = true;
    try {
      await api('POST', `/api/submissions/${s.id}/grade`, { score: Number(score), feedback: feedback.trim() });
      initial.score = String(score); initial.feedback = feedback;
      toast(`Grade saved: ${score}/100`); refreshBadges();
      return true;
    } catch (err) { toast(err.message, 'err'); return false; }
    finally { btn.disabled = false; }
  }
  root.addEventListener('click', async (e) => {
    const t = e.target;
    if (t.closest('[data-exit]')) {
      if (await exitConfirm(isDirty, { what: 'grading' })) goTo(`#/t/assignments/${a.id}`);
      return;
    }
    const q = t.closest('[data-q]'); if (q) { setScore(q.dataset.q); return; }
    if (t.closest('#g-save')) {
      if (await saveGrade()) {
        const nxt = siblings.slice(idx + 1).find((x) => x.status === 'submitted') || siblings.slice(0, idx).find((x) => x.status === 'submitted');
        if (nxt) goTo(`#/t/review/${nxt.id}`); else goTo(`#/t/assignments/${a.id}`);
      }
      return;
    }
    const nv = t.closest('[data-nav]');
    if (nv && nv.dataset.nav) {
      if (isDirty() && !(await exitConfirm(isDirty, { what: 'grading' }))) return;
      goTo(`#/t/review/${nv.dataset.nav}`);
    }
  });
  setLeaveGuard(async () => (!isDirty() ? true : exitConfirm(isDirty)));
  const onBU = (e) => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } };
  window.addEventListener('beforeunload', onBU);
  return () => { players.forEach((p) => p.destroy()); window.removeEventListener('beforeunload', onBU); };
}

/* ---------------- Student detail ---------------- */

  const avg = graded.length ? Math.round(graded.reduce((t, x) => t + x.score, 0) / graded.length) : null;
  const done = A.filter((x) => x.status === 'submitted' || x.status === 'graded').length;
  v.innerHTML = `<div class="view">
    <div class="crumbs"><a href="#/t/classes">Classes</a>${icon('chevronR')}${d.classes.map((c) => `<a href="#/t/classes/${c.id}">${esc(c.name)}</a>`).join(', ')}</div>
    <div class="page-head"><div class="row" style="gap:16px">${avatar(d.student.name, 'lg')}<div><h1>${esc(d.student.name)}</h1><p class="sub">${esc(d.student.email)}</p></div></div>
      <div class="row-wrap"><a class="btn" href="#/messages/${d.student.id}">${icon('message')}Message</a><a class="btn btn-primary" href="#/t/assignments/new?student=${d.student.id}&class=${d.classes[0].id}">${icon('plus')}Assign a task</a></div></div>
    <div class="stats">
      ${stat('Assigned', A.length, 'book', 'rgba(139,123,255,.22)', '#d4cfff')}
      ${stat('Completed', `${done}<small>/${A.length}</small>`, 'check', 'rgba(34,211,238,.2)', '#a5f3fc')}
      ${stat('Overdue', A.filter((x) => (x.status === 'not_started' || x.status === 'in_progress') && isOverdue(x.dueAt)).length, 'clock', 'rgba(251,113,133,.22)', '#fecdd3')}
      ${stat('Average', avg === null ? '—' : `${avg}<small>/100</small>`, 'trophy', 'rgba(52,211,153,.2)', '#a7f3d0')}
    </div>
    <section class="glass panel">
      <div class="section-title"><h2>Assignments</h2></div>
      ${A.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>Assignment</th><th class="hide-m">Due</th><th>Status</th><th>Score</th></tr></thead><tbody>
        ${A.map((x) => `<tr ${x.submissionId && x.status !== 'in_progress' ? `class="clickable" data-href="#/t/review/${x.submissionId}" tabindex="0"` : ''}><td><div style="font-weight:600">${esc(x.title)}</div><div class="faint small">${esc(x.className)}</div></td>
          <td class="hide-m muted small">${x.dueAt ? fmtDateTime(x.dueAt) : '—'}</td>
          <td>${chip(x.status)}${(x.status === 'not_started' || x.status === 'in_progress') && isOverdue(x.dueAt) ? ' ' + chip('late', 'Overdue') : ''}</td>
          <td>${x.status === 'graded' ? `<span class="score" style="font-size:16px">${x.score}<small>/100</small></span>` : '<span class="faint">—</span>'}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty"><div class="art">${icon('book')}</div><h3>No published assignments</h3><p>Assignments you publish to this student will appear here.</p></div>`}
    </section></div>`;
  v.addEventListener('click', (e) => { const r = e.target.closest('[data-href]'); if (r) navigate(r.dataset.href); });
  v.addEventListener('keydown', (e) => { const r = e.target.closest('[data-href]'); if (r && e.key === 'Enter') navigate(r.dataset.href); });
}

/* ---------------- Students (all classes) ---------------- */
async function studentsView() {
  const v = shell('students');
  const alive = viewAlive();
  v.innerHTML = loadingView();
  let list;
  try { list = (await api('GET', '/api/teacher/students')).students; } catch (e) { if (alive()) v.innerHTML = errorView(e.message); return; }
  if (!alive()) return;

        <span class="thumb"></span>
        <button type="button" data-role="student" aria-pressed="${role === 'student'}">${icon('grad')}Student</button>
        <button type="button" data-role="teacher" aria-pressed="${role === 'teacher'}">${icon('teacher')}Teacher</button>
      </div>
      <h2 style="margin-top:24px" class="a-title"></h2>
      <p class="sub a-sub"></p>
      <form class="form-grid" novalidate>
        ${reg ? `<div class="field"><label for="f-name">Full name</label><input class="input" id="f-name" name="name" autocomplete="name" required maxlength="80" placeholder="Your name"></div>` : ''}
        <div class="field"><label for="f-email">Email</label><input class="input" id="f-email" name="email" type="email" autocomplete="email" required maxlength="160" placeholder="you@school.edu"></div>
        <div class="field"><label for="f-pw">Password</label><div class="pw-wrap"><input class="input" id="f-pw" name="password" type="password" autocomplete="${reg ? 'new-password' : 'current-password'}" required minlength="${reg ? 8 : 1}" placeholder="${reg ? 'At least 8 characters' : 'Your password'}"><button type="button" class="icon-btn" data-pw aria-label="Show password">${icon('eye')}</button></div></div>
        ${reg ? `<div class="field code-field"><label for="f-code">Class code <span class="faint">(optional · 6–8 digits)</span></label><input class="input code-input" id="f-code" name="code" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="e.g. 583921" value="${esc(code)}"></div>` : ''}
        <label class="check"><input type="checkbox" name="remember" checked> Keep me signed in on this device</label>
        <div class="form-error" hidden></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">${reg ? 'Create account' : 'Sign in'}</button>
      </form>
      <div class="or-sep"><span>or continue with</span></div>
      <div class="social-grid">${PROVIDERS.map((p) => `<button type="button" class="btn social-btn" data-social="${p.key}">${p.svg}<span>${p.label}</span></button>`).join('')}</div>
      ${reg ? '' : '<p class="hint" style="text-align:center;margin-top:14px">Accounts are saved in this browser. Sign in with the same browser you used to create your account.</p>'}
      <p class="auth-switch">${reg ? 'Already have an account? <a href="#/login" data-switch>Sign in</a>' : 'New to AssignmentPro? <a href="#/register" data-switch>Create an account</a>'}</p>
    </section>
    <div class="solo-foot">${zeeyo()}</div>
  </div>`;
  const card = $('.auth-card');
  const seg = $('.segmented', card);
  const thumb = $('.thumb', seg);
  const errEl = $('.form-error', card);
  const setRole = (r) => {
    role = r;
    $$('[data-role]', seg).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === r)));
    const btn = $(`[data-role="${r}"]`, seg);
    thumb.style.width = btn.offsetWidth + 'px';
    thumb.style.transform = `translateX(${btn.offsetLeft - 4}px)`;
    $('.a-title', card).textContent = reg ? (r === 'teacher' ? 'Create a teacher account' : 'Create a student account') : (r === 'teacher' ? 'Teacher sign in' : 'Student sign in');
    $('.a-sub', card).textContent = reg
      ? (r === 'teacher' ? 'Create classes, publish assignments and grade submissions.' : 'Join your classes and complete assignments.')
      : (r === 'teacher' ? 'Welcome back. Your classes are waiting.' : 'Welcome back. Let’s pick up where you left off.');
    const cf = $('.code-field', card); if (cf) cf.hidden = r !== 'student';
    $$('[data-switch]', card).forEach((a) => { a.href = `#/${reg ? 'login' : 'register'}?role=${r}${code ? '&code=' + code : ''}`; });
  };
  requestAnimationFrame(() => setRole(role));
  window.addEventListener('resize', () => $('.segmented') && setRole(role), { passive: true });
  seg.addEventListener('click', (e) => { const b = e.target.closest('[data-role]'); if (b) setRole(b.dataset.role); });
  $('[data-pw]', card).addEventListener('click', (e) => {
    const inp = $('#f-pw'); const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    e.currentTarget.innerHTML = icon(show ? 'eyeOff' : 'eye');
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  const codeIn = $('#f-code', card); if (codeIn) codeIn.addEventListener('input', () => { const d = codeIn.value.replace(/\D/g, '').slice(0, 8); if (d !== codeIn.value) codeIn.value = d; });
  $$('[data-social]', card).forEach((b) => b.addEventListener('click', async () => {
    errEl.hidden = true;
    const all = $$('[data-social]', card); all.forEach((x) => { x.disabled = true; });
    try {
      const p = await socialLogin(b.dataset.social);
      const rem = $('[name=remember]', card);
      const r = await api('POST', '/api/auth/oauth', { ...p, role, remember: rem ? rem.checked : true, inviteCode: role === 'student' ? ($('#f-code') ? $('#f-code').value : code) : '' });
      state.user = r.user;
      toast(r.roleAdded ? `Your account now also has a ${r.user.role} profile. You can switch any time.` : r.joined ? `Welcome! You joined ${r.joined}.` : `Welcome, ${r.user.name.split(' ')[0]}!`);
      navigate(next && next.startsWith('#/') && !/^#\/(login|register)/.test(next) ? next : homeFor(r.user), { replace: true });
    } catch (err) {
      if (!err.cancelled) { errEl.innerHTML = `${icon('alert')}<span>${esc(err.message)}</span>`; errEl.hidden = false; }
      all.forEach((x) => { x.disabled = false; });
    }
  }));
  onSubmit($('form', card), async (f) => {
    const fd = new FormData(f);
    const btn = $('button[type=submit]', f);
    errEl.hidden = true;
    const showErr = (m) => { errEl.innerHTML = `${icon('alert')}<span>${esc(m)}</span>`; errEl.hidden = false; };
    const email = String(fd.get('email') || '').trim();
    const pw = String(fd.get('password') || '');
    if (reg && String(fd.get('name') || '').trim().length < 2) return showErr('Please enter your full name.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showErr('Please enter a valid email address.');
    if (reg && pw.length < 8) return showErr('Password must be at least 8 characters.');
    if (!pw) return showErr('Please enter your password.');
    btn.disabled = true; const lbl = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>';
    try {
      const body = { role, email, password: pw, remember: !!fd.get('remember') };
      let r;
      if (reg) r = await api('POST', '/api/auth/register', { ...body, name: String(fd.get('name')).trim(), inviteCode: role === 'student' ? String(fd.get('code') || '') : '' });
      else r = await api('POST', '/api/auth/login', body);
      state.user = r.user; try { localStorage.setItem('ap_last_role', r.user.role); } catch { /* ignore */ }
      if (r.roleAdded) toast(`Your account now also has a ${r.user.role} profile. You can switch any time.`);
      else if (r.joined) toast(`Welcome! You joined ${r.joined}.`);
      else toast(reg ? `Welcome to AssignmentPro, ${r.user.name.split(' ')[0]}!` : `Welcome back, ${r.user.name.split(' ')[0]}!`);
      const dest = next && next.startsWith('#/') && !/^#\/(login|register)/.test(next) ? next : homeFor(r.user);
      navigate(dest, { replace: true });
    } catch (err) {
      showErr(err.message);
      btn.disabled = false; btn.innerHTML = lbl;
    }
  });
}

/* ---------------- Settings ---------------- */
async function settingsView() {
  const v = shell('settings');
  const u = state.user;
  v.innerHTML = `<div class="view">
    <div class="page-head"><div><div class="eyebrow">${icon('settings')} Account</div><h1>Account settings</h1><p class="sub">Manage your profile, password and sessions.</p></div></div>
    <div class="grid grid-2">
      <section class="glass panel form-grid">
        <div class="row">${avatar(u.name, 'lg')}<div><h3 style="font-size:19px">${esc(u.name)}</h3><div class="muted small" style="text-transform:capitalize">${u.role} · ${esc(u.email)}</div></div></div>
        <hr class="divider">
        <form class="form-grid" id="profile-form">
          <div class="field"><label for="s-name">Full name</label><input class="input" id="s-name" name="name" value="${esc(u.name)}" maxlength="80" required></div>
          <div class="field"><label for="s-email">Email</label><input class="input" id="s-email" value="${esc(u.email)}" disabled></div>
          <div><button class="btn btn-primary" type="submit">Save profile</button></div>
        </form>
      </section>
      <section class="glass panel form-grid">
        <h3 style="font-size:18px">Change password</h3>
        <form class="form-grid" id="pw-form">
          <div class="field"><label for="s-cur">Current password</label><input class="input" id="s-cur" name="current" type="password" autocomplete="current-password" required></div>
          <div class="field"><label for="s-new">New password</label><input class="input" id="s-new" name="next" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters"></div>
          <div><button class="btn" type="submit">${icon('key')}Update password</button></div>
          <p class="hint">Changing your password signs you out on every other device.</p>
        </form>
      </section>
      <section class="glass panel form-grid">
        <h3 style="font-size:18px">Account type</h3>
        <p class="muted">You are using AssignmentPro as a <b style="text-transform:capitalize">${u.role}</b>. One account can be both a student and a teacher — switch the view any time.</p>
        <div><button class="btn" data-switch-role>${icon('swap')}Switch to ${u.role === 'teacher' ? 'student' : 'teacher'} view</button></div>
      </section>
      <section class="glass panel form-grid">
        <h3 style="font-size:18px">Sessions</h3>
        <p class="muted">Sign out of this device, or everywhere you are signed in.</p>
        <div class="row-wrap"><button class="btn" data-act="logout">${icon('logout')}Sign out</button><button class="btn btn-ghost" data-act="logout-all">Sign out everywhere</button></div>
      </section>
      <section class="glass panel form-grid">
        <h3 style="font-size:18px">About</h3>
        <p class="muted">${isServerMode() ? 'AssignmentPro saves accounts, classes, assignments, answers, recordings and grades permanently on the AssignmentPro server, so you can sign in from any device.' : 'AssignmentPro saves accounts, classes, assignments, answers, recordings and grades permanently in this browser\'s built-in database (IndexedDB). Everyone using this copy should use the same browser on this device.'}</p>
        ${zeeyo()}
      </section>
    </div></div>`;
  onSubmit($('#profile-form', v), async () => {
    const name = $('#s-name', v).value.trim();
    try { const r = await api('PATCH', '/api/me', { name }); state.user = r.user; toast('Profile saved'); settingsView(); }
    catch (err) { toast(err.message, 'err'); }
  });
  onSubmit($('#pw-form', v), async (f) => {
    if (f.next.value.length < 8) return toast('New password must be at least 8 characters.', 'err');
    try { await api('POST', '/api/me/password', { current: f.current.value, next: f.next.value }); f.reset(); toast('Password updated'); }
    catch (err) { toast(err.message, 'err'); }
  });
  v.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'logout') return logout();
    if (await confirmDialog({ title: 'Sign out everywhere?', body: 'You will be signed out on all devices, including this one.', confirm: 'Sign out everywhere', iconName: 'logout' })) {
      try { await api('POST', '/api/auth/logout-all'); } catch { /* ignore */ }
      state.user = null; stopPolling(); navigate('#/login', { replace: true, force: true });
    }
  });
}

async function logout() {
  try { await api('POST', '/api/auth/logout'); } catch { /* ignore */ }
  state.user = null; stopPolling();
  toast('Signed out');
  navigate('#/login', { replace: true, force: true });
}

async function joinRoute({ code }) {
  const c = String(code || '').replace(/\D/g, '');
  if (!state.user) { navigate(`#/register?role=student&code=${c}`, { replace: true }); return; }
  if (state.user.role !== 'student') { try { state.user = (await api('POST', '/api/me/role', { role: 'student' })).user; } catch (err) { toast(err.message, 'err'); return; } }
  try {
    const r = await api('POST', '/api/classes/join', { code: c });
    toast(r.alreadyMember ? `You're already in ${r.class.name}` : `You joined ${r.class.name}!`);
  } catch (err) { toast(err.message, 'err'); }
  navigate('#/s/classes', { replace: true });
}

/* ---------------- Boot ---------------- */
addRoute('/', landingView);
addRoute('/signin', () => navigate('#/login', { replace: true }));
addRoute('/signup', () => navigate('#/register', { replace: true }));
addRoute('/login', () => authView('login'));
addRoute('/register', () => authView('register'));
addRoute('/settings', guard(null, settingsView));
addRoute('/join/:code', joinRoute);
registerStudentRoutes();
registerTeacherRoutes();
registerWorkspaceRoute();
registerMessageRoutes();

/* Switch between the student and teacher side of the same account. */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-switch-role]'); if (!b || !state.user) return;
  const to = state.user.role === 'teacher' ? 'student' : 'teacher';
  try {
    const r = await api('POST', '/api/me/role', { role: to });
    state.user = r.user; toast(`Switched to your ${to} view`);
    navigate(homeFor(r.user), { replace: true, force: true });
  } catch (err) { toast(err.message, 'err'); }
});

setSessionLostHandler(() => {
  stopPolling();
  toast('Your session has ended. Please sign in again.', 'err');
  navigate(`#/login?next=${encodeURIComponent(routeHash())}`, { replace: true, force: true });
});

/* Attachments live in the local database: open or download them on click. */
document.addEventListener('click', async (e) => {
  const a = e.target.closest('[data-file]'); if (!a) return;
  e.preventDefault();
  try {
    const info = await attachmentInfo(a.dataset.file);
    const url = await fileURL('attachments', a.dataset.file);
    const link = document.createElement('a');
    link.href = url; link.download = info.filename; link.rel = 'noopener';
    document.body.append(link); link.click(); link.remove();
  } catch (err) { toast(err.message || 'Could not open the file.', 'err'); }
});

function storageBlockedView() {
  $('#app').innerHTML = `<div class="auth" style="grid-template-columns:minmax(0,560px);justify-content:center">
    <section class="auth-card glass" style="text-align:center;display:grid;gap:14px;justify-items:center">
      ${brandHTML('#/')}
      <div class="empty" style="padding:10px 0 0"><div class="art">${icon('lock')}</div></div>
      <h2>Saving is blocked here</h2>
      <p class="muted">AssignmentPro is open somewhere that can't save data — for example a file preview, a sandboxed viewer, or a private/incognito window. Accounts can't be created or signed in to here.</p>
      <div class="glass glass-thin" style="text-align:left;padding:16px 18px;border-radius:18px;display:grid;gap:8px;width:100%">
        <b>To fix it:</b>
        <span class="muted">1. Download <b>AssignmentPro.html</b> to your computer.</span>
        <span class="muted">2. Double-click the downloaded file so it opens in Chrome, Edge or Firefox.</span>
        <span class="muted">3. Use a normal window, not private/incognito.</span>
      </div>
      ${zeeyo()}
    </section></div>`;
}

(async function boot() {
  initGlassLight();
  await initBackend();
  if (!(await storageCheck())) { storageBlockedView(); return; }
  try { state.user = (await api('GET', '/api/me')).user; } catch { state.user = null; }
  initRouter();
})();


document.addEventListener('click', (e) => { if (e.target.closest('[data-theme-toggle]')) setTheme(currentTheme() === 'light' ? 'dark' : 'light'); });

Object.assign(__m.app, { viewAlive, homeFor, shell, refreshBadges, guard, logout });
})();

</script>
